[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "twinkly-pro"
version = "0.1.0"
description = "Advanced Home Assistant custom integration for Twinkly smart LED lights with grouping, playlists, music mode, effect generator, and embedded Twinkly Studio web panel"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Kuresha-HA"}
]
dependencies = [
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
include = ["custom_components*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
